<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Øyvinds treningsøkter</title>
<meta name="theme-color" content="#0b1016">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
/* Layout: én kolonne, mobil først. Spillerskjermene fyller hele skjermen med store tall som leses på mølla. */
--bg:#0b1016;
--surface:#141b24;
--surface-2:#1c2531;
--line:#2a3542;
--text:#eef3f8;
--muted:#8d9aab;
--accent:#ff8a3d;
--walk:#4fb3ff;
--run:#ff8a3d;
--rest:#7f8da0;
--z1:#7f8da0; --z2:#4fb3ff; --z3:#3ecf8e; --z4:#ffb020; --z5:#ff4d5e;
--ok:#3ecf8e;
--dimtext:#5d6876;
--font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
--font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.4;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px}
h2{font-size:22px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:600;border:1px solid var(--line)}
.chip.on{border-color:var(--z2);color:var(--z2)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:12px;font-weight:700;font-size:17px;background:var(--surface-2);border:1px solid var(--line);min-height:52px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0d03}
.btn.big{font-size:22px;min-height:68px;font-family:var(--font-display);letter-spacing:.03em}
.btn.wide{width:100%}
.tag{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.05em;padding:2px 8px;border-radius:6px;background:var(--surface-2);text-transform:uppercase}
.tag.A{color:var(--z2)} .tag.B{color:var(--z3)} .tag.C{color:var(--z4)} .tag.D{color:var(--run)}
.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.next .title{font-size:26px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.item .d{font-family:var(--font-display);font-size:15px;color:var(--muted);line-height:1.1}
.item .d b{display:block;font-size:22px;color:var(--text)}
.item.today{border-color:var(--accent)}
.item.done{opacity:.6}
.check{color:var(--ok);font-weight:700;font-size:20px}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:var(--surface-2);border-radius:10px}
button.step{width:100%;text-align:left;border:1px solid var(--line);touch-action:manipulation}
button.step:active{border-color:var(--accent)}
.btn:disabled{opacity:.35}
.step .bar{width:8px;height:100%;min-height:30px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}
.banner{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:15px}
/* Spiller (mølle) */
.player{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 12px);gap:10px;z-index:10;overflow-y:auto}
.pbar{display:flex;gap:2px;height:10px}
.pbar span{flex:1;border-radius:3px;background:var(--surface-2);position:relative;overflow:hidden}
.pbar span i{position:absolute;inset:0;transform-origin:left;background:currentColor}
.ptop{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display);font-size:18px;color:var(--muted)}
.ptop b{color:var(--text);font-size:22px}
.stepname{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.clock{font-family:var(--font-display);font-weight:700;font-size:min(34vw,170px);line-height:.9;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tile .k{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--font-display);font-weight:700;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:20px;color:var(--muted);margin-left:4px}
.hrtile{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center}
.hrtile .v{font-size:64px}
.zone{font-family:var(--font-display);font-weight:700;font-size:22px;padding:6px 12px;border-radius:10px;background:var(--surface-2)}
.nextup{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:17px}
.nextup b{font-family:var(--font-display);font-size:20px}
.pcontrols{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;margin-top:auto}
.note{font-size:16px;color:var(--muted)}
.flash{animation:flash .6s ease-out}
@keyframes flash{from{background:var(--accent)}to{background:var(--bg)}}
/* Styrke */
.fig{background:var(--surface-2);border-radius:14px;display:flex;justify-content:center;padding:6px}
.fig svg{width:100%;max-width:300px;height:auto}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 56px;gap:8px;align-items:center}
.set .n{font-family:var(--font-display);font-size:22px;color:var(--muted);text-align:center}
.field{display:flex;flex-direction:column;gap:2px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input{width:100%;font:inherit;font-family:var(--font-display);font-size:26px;font-weight:600;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
.tick{height:52px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:24px;font-weight:700}
.tick.on{background:var(--ok);border-color:var(--ok);color:#03140b}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.rest{position:fixed;inset:0;background:rgba(6,9,13,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:20;padding:20px}
.rest .clock{font-size:min(40vw,190px)}
.exnav{display:flex;gap:8px;flex-wrap:wrap}
.exnav button{min-width:46px;height:46px;font-size:18px;touch-action:manipulation;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-display);font-weight:700}
.exnav button.cur{border-color:var(--accent);color:var(--accent)}
.exnav button.ok{background:var(--ok);border-color:var(--ok);color:#03140b}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{height:46px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-display);font-size:22px;font-weight:700}
.rpe button.on{background:var(--accent);color:#1a0d03;border-color:var(--accent)}
textarea{width:100%;min-height:70px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){.flash{animation:none}}
.toggle{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;cursor:pointer;padding:4px 0}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .sw{width:52px;height:30px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.toggle input:checked + .sw{background:var(--accent);border-color:var(--accent)}
.toggle input:checked + .sw::after{transform:translateX(22px);background:#1a0d03}
.toggle input:focus-visible + .sw{outline:3px solid var(--accent);outline-offset:2px}
.adj{display:flex;gap:8px;margin-top:6px}
.adj button{flex:1;height:40px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:24px;font-weight:700}
.dim{position:fixed;inset:0;background:#000;color:var(--dimtext);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:24px;text-align:center;cursor:pointer}
.dimstep{font-family:var(--font-display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.dimhr{font-family:var(--font-display);font-weight:700;font-size:min(40vmin,200px);line-height:.9}
.dimrow{display:flex;gap:28px;margin-top:24px;flex-wrap:wrap;justify-content:center}
.dimnext{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--accent);margin:6px 0 14px;text-transform:uppercase;letter-spacing:.03em}
.dim.blink{animation:dblink .45s ease-out 2}
@keyframes dblink{0%,25%{background:#fff}100%{background:#000}}
.dimv{font-family:var(--font-display);font-weight:600;font-size:min(44px,11vmin);line-height:1}
.tag.X{color:var(--accent)}
@media (orientation:landscape){
.player{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-flow:row dense;align-content:start;column-gap:16px}
.player>*{grid-column:2}
.player>.pbar,.player>.ptop{grid-column:1/-1}
.player>.stepname,.player>.clock,.player>.fig,.player>.cues{grid-column:1}
.player>.stepname{grid-row:3;align-self:start}
.player>.clock{grid-row:3/span 2;align-self:center}
.clock{font-size:min(18vw,40vh)}
.stepname{font-size:min(44px,9vh)}
.pcontrols{margin-top:0}
.dimrow{margin-top:10px}
.dimstep{margin-bottom:4px}
}
@media (max-height:480px){
.tile .v{font-size:34px}.hrtile .v{font-size:44px}.tile{padding:6px 10px}.player{gap:6px}.btn.big{min-height:52px}
}
.dimlbl{font-size:14px;text-transform:uppercase;letter-spacing:.08em}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);background:var(--surface-2);border:1px solid var(--line);padding:14px;border-radius:12px;z-index:40;font-size:15px}
</style>
</head>

let ac=null;
function audio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}catch(e){ac=null}return ac}
function beep(freq=880,ms=150,vol=.35){const a=audio();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type="square";g.gain.value=vol;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+ms/1000);}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function say(t){if(!S.settings.speech)return;try{const u=new SpeechSynthesisUtterance(t);u.lang="nb-NO";u.rate=1.02;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let wake=null;
async function keepAwake(on){
try{
if(on&&S.settings.awake&&"wakeLock" in navigator){if(!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}}

}catch(e){wake=null}
}

/* ---------- Puls fra HRM600 (Bluetooth) ---------- */
const btOk=()=>!!(navigator.bluetooth&&navigator.bluetooth.requestDevice);
async function connectHR(){
if(!btOk()){toast("Bluetooth er ikke tilgjengelig i denne nettleseren. Bruk Chrome på Android.");return}
try{
const dev=await navigator.bluetooth.requestDevice({filters:[{services:["heart_rate"]}]});
const srv=await dev.gatt.connect();
const ch=await (await srv.getPrimaryService("heart_rate")).getCharacteristic("heart_rate_measurement");
await ch.startNotifications();
ch.addEventListener("characteristicvaluechanged",e=>{const v=e.target.value;const f=v.getUint8(0);const hr=(f&1)?v.getUint16(1,true):v.getUint8(1);S.hr=hr;if(player&&!player.paused)S.hrSamples.push(hr);updateHR()});
dev.addEventListener("gattserverdisconnected",()=>{S.hrDev=null;S.hr=null;updateHR();refreshChips();toast("Pulsbeltet ble koblet fra.")});
S.hrDev=dev;refreshChips();toast("HRM600 er koblet til.");
}catch(e){if(e&&e.name!=="NotFoundError")toast("Fikk ikke koblet til pulsbeltet. Fukt beltet, ta det på og prøv igjen.")}
}
function refreshChips(){document.querySelectorAll(".hrbtn").forEach(b=>{b.classList.toggle("on",!!S.hrDev);b.innerHTML=`<span class="dot"></span>${S.hrDev?(S.hr?S.hr+" bpm":"HRM600 koblet"):"Koble til HRM600"}`})}
function updateHR(){
refreshChips();
const z=S.hr!=null?zoneOf(S.hr):null;
const el=$("#hrv");
if(el){if(S.hr==null){el.textContent="--";$("#hrz").textContent="Ikke koblet";$("#hrz").style.color="var(--muted)"}else{el.textContent=S.hr;$("#hrz").textContent=z.l;$("#hrz").style.color=`var(${z.c})`}}
const dh=$("#dimhr");if(dh){dh.textContent=S.hr==null?"--":S.hr;dh.style.color=z?`var(${z.c})`:"var(--dimtext)"}
if(player&&player.step&&player.step.hrMax&&S.hr>player.step.hrMax&&!player.paused){const now=Date.now();if(!player.lastHrWarn||now-player.lastHrWarn>20000){player.lastHrWarn=now;beep(440,250,.3);vib([200,100,200]);say("Pulsen er over "+player.step.hrMax+". Senk farten.")}}
}
let toastT;
function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t)}t.textContent=msg;t.classList.remove("hidden");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add("hidden"),4500)}

function setWorkouts(list,version){S.workouts=(list||[]).slice().sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id));S.wVersion=version||null}
async function loadWorkouts(){
const cached=store.get(LS.workouts,null);
if(cached)setWorkouts(cached.workouts,cached.version);
render();
try{
const r=await fetch("workouts.json",{cache:"no-store"});
if(r.ok){const j=await r.json();if(j&&Array.isArray(j.workouts)){
const local=store.get(LS.workouts,null);
if(!local||!local.imported||String(j.version)>=String(local.version)){setWorkouts(j.workouts,j.version);store.set(LS.workouts,{version:j.version,workouts:j.workouts})}
if(!player)render()}}
}catch(e){}
}
function importWorkouts(text){
let j;try{j=JSON.parse(text)}catch(e){toast("Teksten er ikke gyldig øktdata. Lim inn hele teksten fra Claude.");return false}
const list=Array.isArray(j)?j:j.workouts;
if(!Array.isArray(list)||!list.every(w=>w&&w.id&&w.date&&w.type)){toast("Fant ingen økter i teksten.");return false}
const byId={};S.workouts.forEach(w=>byId[w.id]=w);list.forEach(w=>{if(w.delete)delete byId[w.id];else byId[w.id]=w});
const merged=Object.values(byId);const version=(j.version||todayStr());
setWorkouts(merged,version);store.set(LS.workouts,{version,workouts:merged,imported:true});
toast(`${list.length} økter er lagt inn.`);return true;
}
function lastKg(exKey){
let best=null;
Object.values(S.logs).forEach(l=>{(l.strength||[]).forEach(e=>{if(e.ex===exKey){const kg=(e.sets||[]).filter(s=>s.done&&s.kg).map(s=>+s.kg);if(kg.length&&(!best||l.completedAt>best.t))best={t:l.completedAt,kg:Math.max(...kg)}}})});
return best?best.kg:"";
}
function saveLog(id,data){S.logs[id]=data;const ok=store.set(LS.logs,S.logs);if(!ok)toast("Kunne ikke lagre på telefonen. Kopier loggen og send den til Claude.");return ok}
function exportText(){
const ls=Object.entries(S.logs).sort((a,b)=>String(a[1].completedAt).localeCompare(String(b[1].completedAt)));
return "TRENINGSLOGG "+todayStr()+"\n"+JSON.stringify(ls.map(([id,l])=>Object.assign({id},l)));
}

/* ---------- Mølle-spiller ---------- */
function startTread(w){
const steps=(w.steps||[]).filter(s=>s.dur>0);
if(!steps.length){toast("Økta har ingen steg.");return}
S.hrSamples=[];
player={w,steps,i:0,elapsedStep:0,elapsedTotal:0,dist:0,paused:false,last:performance.now(),warned:{},step:steps[0],speed:steps[0].speed||0,dim:false,lastTouch:Date.now(),wakeUntil:0};
keepAwake(true);fsOn();drawTread();announce();
player.t=setInterval(tickTread,200);
}
function announce(){const s=player.step,k=KIND[s.kind]||KIND.walk;
const parts=[s.label||k.l,fmtMin(s.dur).replace("min","minutter")];if(s.incline!=null)parts.push(nb(s.incline)+" prosent stigning");if(s.speed)parts.push(nb(s.speed)+" kilometer i timen");say(parts.join(". "))}
function setStep(i){const p=player;p.i=i;p.step=p.steps[i];p.elapsedStep=0;p.speed=p.step.speed||0;p.wakeUntil=Date.now()+10000;if(p.dim)setDim(false,true);drawTread(true);announce()}
function tickTread(){
const p=player;if(!p)return;const now=performance.now();const dt=(now-p.last)/1000;p.last=now;if(p.paused)return;
p.elapsedStep+=dt;p.elapsedTotal+=dt;if(p.step.kind!=="hike")p.dist+=p.speed*dt/3600;
const left=p.step.dur-p.elapsedStep,sec=Math.ceil(left);
if(sec<=3&&sec>=1&&!p.warned[p.i+":"+sec]){p.warned[p.i+":"+sec]=1;beep(660,120)}
if(sec===10&&p.step.dur>=20&&p.i<p.steps.length-1&&!p.warned[p.i+":10"]){p.warned[p.i+":10"]=1;beep(880,250);setTimeout(()=>beep(880,250),350);vib([150,80,150]);blinkEl($("#dim"));blinkEl($("#pl"),"flash");if(S.settings.tvMode&&p.dim){setTimeout(()=>{if(player===p&&p.dim)setDim(false)},900);p.wakeUntil=Date.now()+20000}}
if(left<=0){if(p.i>=p.steps.length-1){finishTread();return}beep(990,400);vib([300,100,300]);setStep(p.i+1);return}
if((S.settings.autoDim||S.settings.tvMode)&&(!p.step.ex||S.settings.autoDimStrength)&&!p.dim&&Date.now()-p.lastTouch>(S.settings.tvMode?15000:30000)&&Date.now()>p.wakeUntil&&(p.w.free||p.step.dur-p.elapsedStep>12))setDim(true);
updTread();
}

function matFig(k){const x=EX[k];const q=VQ[k];
return `<div class="fig photo">${x.img?`<img src="${IMG_BASE+x.img}/0.jpg" alt="${esc(x.name)} – start"><img class="b" src="${IMG_BASE+x.img}/1.jpg" alt="${esc(x.name)} – slutt"><span class="lbl">Start ⇄ slutt</span>`:""}</div><ol class="cues">${(x.cues||[]).map(c=>`<li>${esc(c)}</li>`).join("")}</ol>${TEMPO[k]?`<div class="restinfo"><div><b>Tempo:</b> ${esc(TEMPO[k])}</div></div>`:""}${q?`<a class="btn wide vlink" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener">▶ Se video av øvelsen (YouTube)</a>`:""}`}
function exExtra(x){const k=Object.keys(EX).find(q=>EX[q]===x);const t=TEMPO[k],q=VQ[k];
return `<div class="restinfo"><div><b>Pause mellom sett:</b> ${x.rest||75} sek – timeren starter når du huker av settet.</div><div><b>Før neste øvelse:</b> ca. 2 min.</div><div><b>Mellom repetisjonene:</b> ingen pause – jevn, kontrollert rytme${t?`. Tempo: ${esc(t)}`:""}.</div></div>${q?`<a class="btn wide vlink" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener">▶ Se video av øvelsen (YouTube)</a>`:""}`}
function animate(x){
const svg=$("#fig");if(!svg||!x)return;
if(x.img){const f=svg.parentNode;f.classList.add("photo");f.innerHTML=`<img src="${IMG_BASE+x.img}/0.jpg" alt="${esc(x.name)} – start"><img class="b" src="${IMG_BASE+x.img}/1.jpg" alt="${esc(x.name)} – slutt"><span class="lbl">Start ⇄ slutt</span>`;if(!f.nextElementSibling||!f.nextElementSibling.classList.contains("restinfo"))f.insertAdjacentHTML("afterend",exExtra(x));return}
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const t0=performance.now();
const frame=now=>{
let f=((now-t0)%x.dur)/x.dur;f=f<.5?f*2:2-f*2;f=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2; if(reduce)f=.5;
const P={};const keys=new Set([...Object.keys(x.A),...Object.keys(x.B)]);
keys.forEach(k=>{const base=k.endsWith("2")?k.slice(0,-1):k;const a=x.A[k]||x.A[base],b=x.B[k]||x.B[base];P[k]=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]});
["el","ha","kn","ft"].forEach(k=>{if(!P[k+"2"])P[k+"2"]=P[k]});
svg.innerHTML=drawFig(P,x);
if(!reduce)animRaf=requestAnimationFrame(frame);
};
animRaf=requestAnimationFrame(frame);
}
function drawFig(P,x){
const L=(a,b,c,w)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const fg="#eef3f8",bg2="#6f7d90",pr="#4fb3ff";
let s=`<line x1="0" y1="183" x2="200" y2="183" stroke="#2a3542" stroke-width="2"/>`;
(x.props||[]).forEach(p=>{
if(p.t==="line")s+=L(p.p[0],p.p[1],"#3a4757",6);
if(p.t==="rect")s+=`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="3" fill="#3a4757"/>`;
if(p.t==="anchor")s+=`<circle cx="${p.p[0]}" cy="${p.p[1]}" r="5" fill="#3a4757"/>`;
});
s+=L(P.hip,P.kn2,bg2,8)+L(P.kn2,P.ft2,bg2,8)+L(P.ft2,[P.ft2[0]+10,P.ft2[1]],bg2,6);
s+=L(P.sh,P.el2,bg2,7)+L(P.el2,P.ha2,bg2,7);
s+=L(P.neck,P.hip,fg,11);
s+=L(P.hip,P.kn,fg,9)+L(P.kn,P.ft,fg,9)+L(P.ft,[P.ft[0]+10,P.ft[1]],fg,7);
s+=`<circle cx="${P.head[0].toFixed(1)}" cy="${P.head[1].toFixed(1)}" r="11" fill="${fg}"/>`;
s+=L(P.sh,P.el,fg,8)+L(P.el,P.ha,fg,8);
(x.props||[]).forEach(p=>{
const a=P[p.at];
if(p.t==="db"&&a)s+=`<rect x="${(a[0]-9).toFixed(1)}" y="${(a[1]-4).toFixed(1)}" width="18" height="8" rx="2" fill="${pr}"/>`;
if(p.t==="bar"&&a)s+=L([a[0]-22,a[1]],[a[0]+22,a[1]],pr,5);
if(p.t==="cable"&&a)s+=L([a[0],a[1]],[a[0],-30],"#4fb3ff88",2);
if(p.t==="cablefrom"&&a)s+=L(p.from,a,"#4fb3ff88",2);
if(p.t==="plate"&&a)s+=L([a[0]+6,a[1]-24],[a[0]+6,a[1]+20],pr,7);
});
return s;
}
