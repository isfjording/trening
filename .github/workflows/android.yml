name: Android-app
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bygg APK
        run: |
          mkdir -p build-src
          tar xzf android/app-src.tgz -C build-src
          cd build-src
          gradle --no-daemon --stacktrace assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../trening.apk
      - name: Publiser APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Treningsappen for Android
          body: Last ned trening.apk på telefonen og installer den. Nyeste versjon ligger alltid her.
          files: trening.apk
          make_latest: true
